<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Quantitative Trading Bot & AI Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">

    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-md">
        <!-- Logo y Encabezado -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 mb-4 shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-chart-line text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">QUANTITATIVE TRADING BOT</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Google Cloud Platform • Gemini Enterprise • ML Engine</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Usuario Institucional</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </span>
                    <input type="text" name="username" required value="admin"
                        class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5 uppercase tracking-wider">Contraseña de Seguridad</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required value="cuantitativo2026"
                        class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                </div>
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-cyan-500/25 transition duration-200 flex items-center justify-center gap-2">
                <span>Ingresar al Dashboard de Trading</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Usuarios demo para la defensa en vivo -->
        <div class="mt-8 pt-6 border-t border-slate-800">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 text-center">Usuarios Autorizados para la Defensa:</p>
            <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-400">
                <div class="p-2 bg-slate-950/50 rounded-lg border border-slate-800">
                    <span class="text-cyan-400 font-semibold">admin</span> / cuantitativo2026
                </div>
                <div class="p-2 bg-slate-950/50 rounded-lg border border-slate-800">
                    <span class="text-blue-400 font-semibold">profesor</span> / gcp2026
                </div>
            </div>
            <p class="text-[10px] text-slate-500 text-center mt-3">Despliegue verificado en Google Cloud Compute Engine (e2-medium)</p>
        </div>
    </div>

</body>
</html>
